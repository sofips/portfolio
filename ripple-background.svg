<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <!-- Gradient used for line color similar to canvas radial gradient -->
    <radialGradient id="lineGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#e94560" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#533483" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#533483" stop-opacity="0.15"/>
    </radialGradient>

    <!-- Thin grid pattern (50px) -->
    <pattern id="gridPattern" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 0 0 L 0 50" stroke="url(#lineGlow)" stroke-width="2" stroke-linecap="square" />
      <path d="M 0 0 L 50 0" stroke="url(#lineGlow)" stroke-width="2" stroke-linecap="square" />
    </pattern>

    <!-- Turbulence + displacement to create ripples -->
    <filter id="rippleFilter" x="-20%" y="-20%" width="140%" height="140%">
      <!-- turbulence creates smooth noise -->
      <feTurbulence type="turbulence" baseFrequency="0.006" numOctaves="3" seed="3" result="turb" />
      <!-- amplify and shift values for a more circular wave look -->
      <feGaussianBlur in="turb" stdDeviation="6" result="blur"/>
      <feDisplacementMap in="SourceGraphic" in2="blur" scale="40" xChannelSelector="R" yChannelSelector="G" />
    </filter>

    <!-- Subtle vignette / radial fade to mimic canvas gradient opacity -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.0"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </radialGradient>

    <!-- A soft overlay to tint the result closer to site's background -->
    <linearGradient id="tint" x1="0" x2="1">
      <stop offset="0%" stop-color="#0f3460" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#16213e" stop-opacity="0.16" />
    </linearGradient>
  </defs>

  <!-- Base dark background like site -->
  <rect width="100%" height="100%" fill="#1a1a2e" />

  <!-- Grid group: filled rectangle using the pattern, then displaced for ripple -->
  <g filter="url(#rippleFilter)" opacity="0.9">
    <rect width="100%" height="100%" fill="url(#gridPattern)" />
  </g>

  <!-- Glow overlay: radial gradient with blend-like effect -->
  <rect width="100%" height="100%" fill="url(#lineGlow)" opacity="0.08" />

  <!-- Tint to match site colors -->
  <rect width="100%" height="100%" fill="url(#tint)" />

  <!-- Final soft vignette for depth and match to canvas fade -->
  <rect width="100%" height="100%" fill="url(#vignette)" />

  <!-- Reduce overall opacity to match CSS .ripple-grid-background opacity:0.3 -->
  <g opacity="0.3">
    <!-- Repeat the displaced grid lightly for a layered glow feel -->
    <g filter="url(#rippleFilter)">
      <rect width="100%" height="100%" fill="url(#gridPattern)" />
    </g>
  </g>

</svg>
